<template>
<form>
  <h1>Form</h1>

  <fieldset>
    <label><input type="radio" name="color" value="red" x-model="this.color"> Red</label>
    <label><input type="radio" name="color" value="green" x-model="this.color"> Green</label>
    <label><input type="radio" name="color" value="blue" x-model="this.color"> Blue</label>
  </fieldset>
  <br>
  <div class="flex">
    <input type="text" x-model="this.query">
    <button @click="this.clearQuery(event)">Clear</button>
    <select x-model="this.city">
      <option>tokyo</option>
      <option>paris</option>
      <option>berlin</option>
    </select>
  </div>
  <br>
  <label><input type="checkbox" value="red" x-model="this.invert"> Invert</label>
  <label><input type="checkbox" value="green" x-model="this.limit"> Limit</label>
  <button @click="this.toggleAll(event)">Toggle all</button>
</form>
</template>

<script>
export default class {
  initialize() {
    this.query = 'ducks'
    this.color = 'red'
    this.city = 'tokyo'
    this.invert = true
    this.limit = true

    this.$watch(_ => this.query, () => {
      console.log("QQ", this.query)
    })
    this.$watch(_ => this.color, () => {
      console.log("CC", this.color)
    })
    this.$watch(_ => this.city, () => {
      console.log("YY", this.city)
    })
    this.$watch(_ => this.invert, () => {
      console.log("VV", this.invert)
    })
    this.$watch(_ => this.limit, () => {
      console.log("LL", this.limit)
    })
  }
  clearQuery(e) {
    e.preventDefault()
    this.query = ''
  }
  toggleAll(e) {
    e.preventDefault()
    this.invert = !this.invert
    this.limit = this.invert
  }
}
</script>

<style>
form {
  max-width: 400px;
}
</style>
