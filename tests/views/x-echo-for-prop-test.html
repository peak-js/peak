<template>
  <span data-testid="echo-name" x-text="this._name"></span>
  <span data-testid="echo-value" x-text="this._value"></span>
</template>

<script>
export default class {
  initialize() {
    // Store $prop results in separate properties — these won't get
    // overwritten by the render function's later el.name = ... assignment.
    this._name = this.$prop('name') || ''
    this._value = this.$prop('value') || ''
  }
}
</script>
