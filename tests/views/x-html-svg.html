<template>
  <div>
    <h1>SVG via x-html</h1>
    <div data-testid="status">loaded</div>
    <svg
      width="100" height="100"
      xmlns="http://www.w3.org/2000/svg"
      x-html="this.svgContent"
    ></svg>
    <div data-testid="circle-cx" x-text="this.circleCx"></div>
  </div>
</template>

<script>
export default class {
  initialize() {
    // <circle> has getter-only cx, cy, r properties on SVGCircleElement
    this.svgContent = '<circle cx="50" cy="50" r="40" fill="red" />'
    this.circleCx = ''
  }

  mounted() {
    // After render, check that the circle rendered correctly
    const circle = this.querySelector('circle')
    this.circleCx = circle ? circle.getAttribute('cx') : 'not-found'
  }
}
</script>
