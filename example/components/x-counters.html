<template>
  <button @click="this.cycleMessage()">CYCLE</button>
  <x-echo :message="this.message"></x-echo>
  <x-echo :message="this.alt"></x-echo>
  <button @click="this.addItem()">ADDZ</button>
  <template x-for="item in this.items">
    <div :key="item.id" x-text="item.name"></div>
  </template>
  <template x-for="item in this.items">
    <x-counter :key="item.id" :item="item"></x-counter>
  </template>
</template>

<script>
export default class {
  initialize() {
    this.mi = 0
    this.messages = [ {text: 'hey'}, {text: 'salut'}, {text: 'greetings'} ]
    this.message = this.messages[0]
    this.alt = { text: 'alternate' }
    this.items = [
      { id: '142', name: 'apple' },
      { id: '143', name: 'banana' },
      { id: '144', name: 'cherry' },
    ]
  }
  addItem() {
    const id = Math.random().toString(36).slice(2);
    this.items.unshift({ id, name: id })
  }
  cycleMessage() {
    this.message = this.messages[++this.mi % this.messages.length]
  }
}
</script>
