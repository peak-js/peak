<template>
  <h1 x-text="this.item.name"></h1>
  <button @click="this.increment()" x-text="this.data.count"></button>
</template>

<script>
export default class {
  initialize() {
    this.item = this.$prop('item')
    this.data = { count: 0 }
  }
  increment() {
    this.data.count++
  }
}
</script>
